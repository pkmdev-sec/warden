<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="#000000"/>
  <text x="600" y="40" text-anchor="middle" font-family="'SF Pro Display', Arial, sans-serif" font-size="20" font-weight="600" fill="#dc2626" letter-spacing="4">WARDEN ARCHITECTURE</text>
  <!-- Operation Input -->
  <rect x="475" y="70" width="250" height="50" rx="6" fill="url(#boxGrad)" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#dc2626">Incoming Operation</text>
  <polygon points="595,125 605,125 600,140" fill="#dc2626" opacity="0.7"/>
  <!-- Access Control Gate -->
  <rect x="350" y="150" width="500" height="55" rx="6" fill="url(#boxGrad)" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#dc2626">Access Control Gate</text>
  <text x="600" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Role-Based Permission Check</text>
  <polygon points="595,210 605,210 600,225" fill="#dc2626" opacity="0.6"/>
  <!-- Core modules -->
  <g font-family="Arial, sans-serif">
    <rect x="100" y="240" width="200" height="70" rx="6" fill="url(#boxGrad)" stroke="#dc2626" stroke-width="1.5"/>
    <text x="200" y="270" text-anchor="middle" font-size="13" fill="#dc2626">policy-engine</text>
    <text x="200" y="290" text-anchor="middle" font-size="10" fill="#666">Rule Evaluation</text>

    <rect x="350" y="240" width="200" height="70" rx="6" fill="url(#boxGrad)" stroke="#dc2626" stroke-width="1.5"/>
    <text x="450" y="270" text-anchor="middle" font-size="13" fill="#dc2626">data-classifier</text>
    <text x="450" y="290" text-anchor="middle" font-size="10" fill="#666">Sensitive Data Detection</text>

    <rect x="600" y="240" width="200" height="70" rx="6" fill="url(#boxGrad)" stroke="#991b1b" stroke-width="1.5"/>
    <text x="700" y="270" text-anchor="middle" font-size="13" fill="#991b1b">audit-logger</text>
    <text x="700" y="290" text-anchor="middle" font-size="10" fill="#666">Immutable Audit Trail</text>

    <rect x="850" y="240" width="200" height="70" rx="6" fill="url(#boxGrad)" stroke="#991b1b" stroke-width="1.5"/>
    <text x="950" y="270" text-anchor="middle" font-size="13" fill="#991b1b">compliance-reporter</text>
    <text x="950" y="290" text-anchor="middle" font-size="10" fill="#666">Reports &amp; Summaries</text>
  </g>
  <!-- Flow arrows -->
  <line x1="300" y1="275" x2="350" y2="275" stroke="#dc2626" stroke-width="1" opacity="0.5"/>
  <line x1="550" y1="275" x2="600" y2="275" stroke="#dc2626" stroke-width="1" opacity="0.5"/>
  <line x1="800" y1="275" x2="850" y2="275" stroke="#991b1b" stroke-width="1" opacity="0.5"/>
  <!-- Decision -->
  <rect x="300" y="380" width="600" height="100" rx="8" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4"/>
  <text x="600" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#666" letter-spacing="2">POLICY DECISION</text>
  <g font-family="Arial, sans-serif" font-size="12">
    <rect x="330" y="420" width="150" height="40" rx="4" fill="#111" stroke="#22c55e" stroke-width="1" opacity="0.6"/>
    <text x="405" y="445" text-anchor="middle" fill="#22c55e" opacity="0.8">ALLOW</text>
    <rect x="525" y="420" width="150" height="40" rx="4" fill="#111" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
    <text x="600" y="445" text-anchor="middle" fill="#f59e0b" opacity="0.8">WARN</text>
    <rect x="720" y="420" width="150" height="40" rx="4" fill="#111" stroke="#dc2626" stroke-width="1" opacity="0.6"/>
    <text x="795" y="445" text-anchor="middle" fill="#dc2626" opacity="0.8">BLOCK</text>
  </g>
  <!-- Policies storage -->
  <rect x="200" y="530" width="350" height="60" rx="6" fill="url(#boxGrad)" stroke="#991b1b" stroke-width="1"/>
  <text x="375" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">policies/*.json</text>
  <text x="375" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Rule Definitions</text>
  <!-- Audit log storage -->
  <rect x="650" y="530" width="350" height="60" rx="6" fill="url(#boxGrad)" stroke="#991b1b" stroke-width="1"/>
  <text x="825" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">audit-log.jsonl</text>
  <text x="825" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Immutable Decision Log</text>
  <!-- Output -->
  <rect x="375" y="640" width="450" height="45" rx="6" fill="url(#boxGrad)" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <text x="600" y="667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#dc2626">Governed Operation Result</text>
</svg>
