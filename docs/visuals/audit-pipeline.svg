<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="12" fill="url(#abg)"/>
  <text x="400" y="38" font-family="monospace" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="700" letter-spacing="3">AUDIT PIPELINE</text>

  <!-- Source: Tool Actions -->
  <g transform="translate(30, 70)">
    <rect width="140" height="110" rx="8" fill="#1e293b" stroke="#374151" stroke-width="1.5"/>
    <text x="70" y="25" font-family="monospace" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">TOOL ACTIONS</text>
    <text x="70" y="48" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Bash</text>
    <text x="70" y="62" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Read / Write / Edit</text>
    <text x="70" y="76" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Grep / Glob</text>
    <text x="70" y="90" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">WebFetch</text>
  </g>

  <!-- Arrow -->
  <line x1="170" y1="125" x2="210" y2="125" stroke="#4b5563" stroke-width="1.5"/>

  <!-- PostToolUse Hook -->
  <g transform="translate(220, 80)">
    <rect width="150" height="90" rx="8" fill="#1e293b" stroke="#dc2626" stroke-width="1.5"/>
    <text x="75" y="25" font-family="monospace" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">WARDEN AUDIT</text>
    <text x="75" y="45" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">PostToolUse Hook</text>
    <text x="75" y="62" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Extract metadata</text>
    <text x="75" y="76" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Classify action</text>
  </g>

  <!-- Arrow -->
  <line x1="370" y1="125" x2="420" y2="125" stroke="#4b5563" stroke-width="1.5"/>

  <!-- JSONL Storage -->
  <g transform="translate(430, 80)">
    <rect width="160" height="90" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="80" y="25" font-family="monospace" font-size="11" fill="#818cf8" text-anchor="middle" font-weight="600">JSONL STORAGE</text>
    <text x="80" y="48" font-family="monospace" font-size="9" fill="#a5b4fc" text-anchor="middle">~/.warden/audit.jsonl</text>
    <text x="80" y="65" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Append-only log</text>
    <text x="80" y="79" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Structured entries</text>
  </g>

  <!-- Arrow -->
  <line x1="590" y1="125" x2="630" y2="125" stroke="#4b5563" stroke-width="1.5"/>

  <!-- Query Engine -->
  <g transform="translate(640, 80)">
    <rect width="130" height="90" rx="8" fill="#1e293b" stroke="#374151" stroke-width="1.5"/>
    <text x="65" y="25" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle" font-weight="600">QUERY ENGINE</text>
    <text x="65" y="48" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Filter by user</text>
    <text x="65" y="62" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Filter by tool</text>
    <text x="65" y="76" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Date ranges</text>
  </g>

  <!-- Report outputs section -->
  <text x="400" y="220" font-family="monospace" font-size="14" fill="#374151" text-anchor="middle" letter-spacing="2">REPORT OUTPUTS</text>
  <line x1="100" y1="230" x2="700" y2="230" stroke="#374151" stroke-width="0.5"/>

  <!-- SOC2 Report -->
  <g transform="translate(40, 250)">
    <rect width="160" height="90" rx="8" fill="#1e293b" stroke="#dc2626" stroke-width="1.5"/>
    <text x="80" y="25" font-family="monospace" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">SOC2 REPORT</text>
    <text x="80" y="48" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">CC6: Access Controls</text>
    <text x="80" y="62" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">CC7: System Ops</text>
    <text x="80" y="76" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">CC8: Change Mgmt</text>
  </g>

  <!-- Executive Summary -->
  <g transform="translate(230, 250)">
    <rect width="160" height="90" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="80" y="25" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="600">EXEC SUMMARY</text>
    <text x="80" y="48" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Compliance rate</text>
    <text x="80" y="62" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Risk level</text>
    <text x="80" y="76" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Top tools</text>
  </g>

  <!-- High Risk Actions -->
  <g transform="translate(420, 250)">
    <rect width="160" height="90" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="80" y="25" font-family="monospace" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="600">HIGH RISK</text>
    <text x="80" y="48" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Policy violations</text>
    <text x="80" y="62" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Blocked actions</text>
    <text x="80" y="76" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Sensitive access</text>
  </g>

  <!-- CSV Export -->
  <g transform="translate(610, 250)">
    <rect width="150" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="75" y="25" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle" font-weight="600">CSV EXPORT</text>
    <text x="75" y="48" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">For auditors</text>
    <text x="75" y="62" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">All fields</text>
    <text x="75" y="76" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Proper escaping</text>
  </g>

  <!-- Arrows from query engine to reports -->
  <line x1="705" y1="170" x2="705" y2="195" stroke="#4b5563" stroke-width="1"/>
  <line x1="120" y1="195" x2="705" y2="195" stroke="#4b5563" stroke-width="1" stroke-dasharray="4"/>
  <line x1="120" y1="195" x2="120" y2="250" stroke="#4b5563" stroke-width="1"/>
  <line x1="310" y1="195" x2="310" y2="250" stroke="#4b5563" stroke-width="1"/>
  <line x1="500" y1="195" x2="500" y2="250" stroke="#4b5563" stroke-width="1"/>
  <line x1="685" y1="195" x2="685" y2="250" stroke="#4b5563" stroke-width="1"/>

  <!-- Footer -->
  <text x="400" y="400" font-family="monospace" font-size="10" fill="#4b5563" text-anchor="middle">WARDEN — Enterprise Policy Enforcement</text>
</svg>
