<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#bg)"/>
  <text x="400" y="40" font-family="monospace" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="700" letter-spacing="3">POLICY ENFORCEMENT FLOW</text>

  <!-- Step 1: Action Initiated -->
  <g transform="translate(50, 80)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#374151" stroke-width="1.5"/>
    <text x="90" y="28" font-family="monospace" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">1. ACTION INITIATED</text>
    <text x="90" y="46" font-family="monospace" font-size="10" fill="#9ca3af" text-anchor="middle">Tool call received</text>
  </g>

  <!-- Arrow -->
  <line x1="230" y1="110" x2="290" y2="110" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Load Policies -->
  <g transform="translate(300, 80)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#374151" stroke-width="1.5"/>
    <text x="90" y="28" font-family="monospace" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">2. LOAD POLICIES</text>
    <text x="90" y="46" font-family="monospace" font-size="10" fill="#9ca3af" text-anchor="middle">Parse JSON rule files</text>
  </g>

  <!-- Arrow down -->
  <line x1="390" y1="140" x2="390" y2="180" stroke="#4b5563" stroke-width="1.5"/>

  <!-- Step 3: Match Rules -->
  <g transform="translate(300, 190)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#dc2626" stroke-width="1.5"/>
    <text x="90" y="28" font-family="monospace" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">3. MATCH RULES</text>
    <text x="90" y="46" font-family="monospace" font-size="10" fill="#9ca3af" text-anchor="middle">tool / command / path</text>
  </g>

  <!-- Branch: No Violation -->
  <line x1="480" y1="220" x2="560" y2="220" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="560" y1="220" x2="560" y2="310" stroke="#4b5563" stroke-width="1.5"/>

  <!-- Branch: Violation -->
  <line x1="390" y1="250" x2="390" y2="300" stroke="#4b5563" stroke-width="1.5"/>

  <!-- Decision diamond text -->
  <text x="410" y="275" font-family="monospace" font-size="10" fill="#6b7280">violation?</text>

  <!-- Step 4a: ALLOW -->
  <g transform="translate(490, 300)">
    <rect width="160" height="55" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="80" y="25" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle" font-weight="600">ALLOW</text>
    <text x="80" y="43" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">Execute action</text>
  </g>
  <text x="540" y="295" font-family="monospace" font-size="9" fill="#10b981">NO</text>

  <!-- Step 4b: EVALUATE SEVERITY -->
  <g transform="translate(300, 300)">
    <rect width="160" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="80" y="25" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="600">EVALUATE</text>
    <text x="80" y="43" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">Check severity</text>
  </g>
  <text x="400" y="295" font-family="monospace" font-size="9" fill="#dc2626">YES</text>

  <!-- Branch from evaluate -->
  <line x1="300" y1="327" x2="220" y2="327" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="220" y1="327" x2="220" y2="390" stroke="#4b5563" stroke-width="1.5"/>

  <line x1="380" y1="355" x2="380" y2="390" stroke="#4b5563" stroke-width="1.5"/>

  <!-- WARN -->
  <g transform="translate(130, 390)">
    <rect width="140" height="50" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="70" y="23" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="600">WARN</text>
    <text x="70" y="40" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">Log + proceed</text>
  </g>
  <text x="195" y="385" font-family="monospace" font-size="9" fill="#f59e0b">warn</text>

  <!-- BLOCK -->
  <g transform="translate(310, 390)">
    <rect width="140" height="50" rx="8" fill="#7f1d1d" stroke="#dc2626" stroke-width="1.5"/>
    <text x="70" y="23" font-family="monospace" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">BLOCK</text>
    <text x="70" y="40" font-family="monospace" font-size="10" fill="#fca5a5" text-anchor="middle">Deny + log</text>
  </g>
  <text x="380" y="385" font-family="monospace" font-size="9" fill="#dc2626">block</text>

  <!-- Step 5: Audit Log (shared destination) -->
  <g transform="translate(560, 390)">
    <rect width="170" height="50" rx="8" fill="#1e293b" stroke="#374151" stroke-width="1.5"/>
    <text x="85" y="23" font-family="monospace" font-size="11" fill="#818cf8" text-anchor="middle" font-weight="600">5. AUDIT LOG</text>
    <text x="85" y="40" font-family="monospace" font-size="10" fill="#a5b4fc" text-anchor="middle">~/.warden/audit.jsonl</text>
  </g>

  <!-- Arrows to audit -->
  <line x1="650" y1="355" x2="650" y2="390" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="270" y1="440" x2="560" y2="440" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="450" y1="440" x2="560" y2="440" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Legend -->
  <g transform="translate(30, 460)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#10b981"/>
    <text x="16" y="9" font-family="monospace" font-size="9" fill="#6b7280">Allowed</text>
    <rect x="80" y="0" width="10" height="10" rx="2" fill="#f59e0b"/>
    <text x="96" y="9" font-family="monospace" font-size="9" fill="#6b7280">Warning</text>
    <rect x="160" y="0" width="10" height="10" rx="2" fill="#dc2626"/>
    <text x="176" y="9" font-family="monospace" font-size="9" fill="#6b7280">Blocked</text>
    <rect x="240" y="0" width="10" height="10" rx="2" fill="#818cf8"/>
    <text x="256" y="9" font-family="monospace" font-size="9" fill="#6b7280">Audit</text>
  </g>
</svg>
